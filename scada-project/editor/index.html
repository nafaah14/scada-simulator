<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCADA Screen Editor</title>
<link rel="stylesheet" href="../shared/symbols.css">
<style>
  :root{ font-size:14px; }
  :root{
    --green:#2fa84f; --red:#e5484d; --amber:#d99418; --orange:#f47b20; --blue:#3f8fce;
    --bg-app:#eef1f4; --bg-panel:#ffffff; --bg-panel-head:#f2f4f6; --bg-field:#f6f8f9;
    --border:#d7dce2; --border-light:#c3cad2; --text:#3a4753; --text-dim:#7c8896;
    --text-bright:#172029; --pipe:#8a2f2f; --vessel:#c7ccd1;
    --chrome:#12181f; --sel:#2f7fd6;
  }
  :root[data-theme="dark"]{
    --bg-app:#0b0f14; --bg-panel:#131a22; --bg-panel-head:#1a222c; --bg-field:#0e141b;
    --border:#2b3542; --border-light:#3a4553; --text:#c8d2dc; --text-dim:#8994a1;
    --text-bright:#eef3f7; --pipe:#b45050; --vessel:#3a4350;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg-app);color:var(--text);
    font-family:"Segoe UI",Arial,sans-serif;overflow:hidden;}
  button,input,select{font-family:inherit;color:inherit;}
  button{cursor:pointer;}

  /* ============ CHROME ============ */
  .app{display:flex;flex-direction:column;height:100%;}
  .toolbar{display:flex;align-items:center;gap:6px;background:linear-gradient(#161d25,#12181f);
    border-bottom:1px solid #232c36;padding:0 10px;height:40px;flex:none;color:#8a94a0;}
  .toolbar .brand{font-weight:700;font-size:12px;letter-spacing:.5px;color:#e7ecf1;margin-right:6px;}
  .tb-sep{width:1px;height:22px;background:#2b3542;margin:0 4px;}
  .tb-btn{background:#1c242e;border:1px solid #2b3542;color:#c2cbd5;font-size:11.5px;
    padding:5px 10px;border-radius:3px;}
  .tb-btn:hover{background:#25303c;border-color:#3a4553;}
  .tb-btn.on{background:var(--orange);border-color:var(--orange);color:#1a1005;font-weight:700;}
  .tb-btn:disabled{opacity:.4;cursor:default;}
  .tb-label{font-size:11px;color:#6f7d8b;}
  .tb-select{background:#1c242e;border:1px solid #2b3542;color:#c2cbd5;font-size:11.5px;
    padding:4px 6px;border-radius:3px;max-width:180px;}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
  .conn{font-size:10.5px;display:flex;align-items:center;gap:5px;}
  .conn i{width:7px;height:7px;border-radius:50%;background:#6f7d8b;display:block;}
  .conn.live i{background:var(--green);}
  .conn.static i{background:var(--amber);}

  .body{display:flex;flex:1;min-height:0;}

  /* ============ PALETTE ============ */
  .palette{width:150px;flex:none;background:var(--bg-panel);border-right:1px solid var(--border);
    overflow-y:auto;padding:8px;}
  .pal-group{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);
    margin:10px 0 5px;font-weight:700;}
  .pal-group:first-child{margin-top:0;}
  .pal-item{display:flex;align-items:center;gap:7px;width:100%;background:var(--bg-field);
    border:1px solid var(--border-light);padding:5px 7px;font-size:11px;margin-bottom:3px;
    border-radius:3px;text-align:left;}
  .pal-item:hover{border-color:var(--blue);background:var(--bg-panel-head);}
  .pal-ic{width:18px;height:15px;flex:none;display:flex;align-items:center;justify-content:center;
    position:relative;}
  .pal-ic .el{position:relative!important;left:0!important;top:0!important;}

  /* ============ CANVAS ============ */
  .stage{flex:1;min-width:0;overflow:auto;background:var(--bg-app);position:relative;padding:20px;}
  .canvas-wrap{position:relative;transform-origin:0 0;}
  #canvas{position:relative;background:var(--bg-app);border:1px solid var(--border-light);
    box-shadow:0 2px 14px rgba(0,0,0,.09);overflow:hidden;}
  #canvas.grid{background-image:
      linear-gradient(to right, rgba(127,140,155,.16) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(127,140,155,.16) 1px, transparent 1px);
    background-size:10px 10px;}
  .mode-edit .el{cursor:move;}
  .mode-edit .el.locked{cursor:not-allowed;}
  .el.selected{outline:1.5px solid var(--sel);outline-offset:1px;}
  .handle{position:absolute;width:8px;height:8px;background:#fff;border:1.5px solid var(--sel);
    border-radius:1px;z-index:9999;}
  .handle.nw{cursor:nwse-resize;} .handle.ne{cursor:nesw-resize;}
  .handle.sw{cursor:nesw-resize;} .handle.se{cursor:nwse-resize;}
  .marquee{position:absolute;border:1px dashed var(--sel);background:rgba(47,127,214,.09);z-index:9998;}

  /* ============ INSPECTOR ============ */
  .inspector{width:250px;flex:none;background:var(--bg-panel);border-left:1px solid var(--border);
    overflow-y:auto;display:flex;flex-direction:column;}
  .insp-head{background:var(--bg-panel-head);padding:7px 10px;font-weight:700;font-size:10px;
    letter-spacing:.6px;text-transform:uppercase;border-bottom:1px solid var(--border);
    color:var(--text-dim);position:sticky;top:0;z-index:2;}
  .insp-body{padding:9px 10px;}
  .fld{margin-bottom:8px;}
  .fld > label{display:block;font-size:10px;color:var(--text-dim);margin-bottom:3px;}
  .fld input[type=text],.fld input[type=number],.fld select{
    width:100%;background:var(--bg-field);border:1px solid var(--border-light);
    padding:4px 6px;font-size:11.5px;border-radius:2px;}
  .fld input[type=color]{width:100%;height:26px;padding:1px;background:var(--bg-field);
    border:1px solid var(--border-light);border-radius:2px;}
  .fld input:focus,.fld select:focus{outline:1.5px solid var(--blue);outline-offset:-1px;}
  .fld-row{display:flex;gap:6px;}
  .fld-row .fld{flex:1;margin-bottom:8px;}
  .fld-check{display:flex;align-items:center;gap:6px;font-size:11.5px;margin-bottom:8px;}
  .btn-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
  .mini-btn{flex:1;background:var(--bg-field);border:1px solid var(--border-light);
    font-size:10.5px;padding:4px 5px;border-radius:2px;white-space:nowrap;}
  .mini-btn:hover{border-color:var(--blue);}
  .mini-btn.danger:hover{border-color:var(--red);color:var(--red);}
  .empty-note{font-size:11px;color:var(--text-dim);line-height:1.55;}
  .row-item{border:1px solid var(--border);background:var(--bg-field);
    padding:5px;margin-bottom:5px;border-radius:2px;}
  .row-head{display:flex;align-items:center;gap:6px;font-size:10px;
    color:var(--text-dim);margin-bottom:3px;}
  .row-head button{margin-left:auto;padding:1px 5px;}
  kbd{background:var(--bg-field);border:1px solid var(--border-light);border-bottom-width:2px;
    border-radius:3px;padding:0 4px;font-size:10px;font-family:inherit;}

  .layers{border-top:1px solid var(--border);margin-top:auto;}
  .layer-list{max-height:190px;overflow-y:auto;}
  .layer{display:flex;align-items:center;gap:5px;padding:3px 9px;font-size:11px;cursor:pointer;
    border-bottom:1px solid var(--bg-panel-head);}
  .layer:hover{background:var(--bg-panel-head);}
  .layer.sel{background:#e2edf9;color:var(--text-bright);}
  :root[data-theme="dark"] .layer.sel{background:#1d304a;}
  .layer .lt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .layer .ltype{font-size:9px;color:var(--text-dim);}
  .layer .eye{font-size:10px;color:var(--text-dim);width:14px;text-align:center;}

  .statusbar{height:24px;flex:none;display:flex;align-items:center;gap:14px;
    background:var(--bg-panel-head);border-top:1px solid var(--border);padding:0 10px;
    font-size:11px;color:var(--text-dim);}
  .statusbar .sp{margin-left:auto;font-family:"Consolas",monospace;}

  .mode-preview .palette,.mode-preview .inspector{display:none;}
  .mode-preview .handle,.mode-preview .marquee{display:none;}
  .mode-preview #canvas{box-shadow:none;}
  .mode-preview .el.selected{outline:none;}

  .toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);
    background:var(--chrome);color:#e7ecf1;font-size:11.5px;padding:7px 14px;border-radius:3px;
    box-shadow:0 3px 14px rgba(0,0,0,.3);z-index:10000;opacity:0;pointer-events:none;
    transition:opacity .18s;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app mode-edit" id="app">

  <div class="toolbar">
    <span class="brand">SCADA EDITOR</span>
    <select class="tb-select" id="screenSel" title="Screen"></select>
    <button class="tb-btn" id="btnNew">New</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="btnSave">Save</button>
    <button class="tb-btn" id="btnExport">Export</button>
    <button class="tb-btn" id="btnImport">Import</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="btnUndo" title="Ctrl+Z">Undo</button>
    <button class="tb-btn" id="btnRedo" title="Ctrl+Shift+Z">Redo</button>
    <div class="tb-sep"></div>
    <button class="tb-btn on" id="btnGrid" title="Snap to grid">Grid 10</button>
    <span class="tb-label">Zoom</span>
    <select class="tb-select" id="zoomSel" style="max-width:80px">
      <option value="0.5">50%</option><option value="0.75">75%</option>
      <option value="1" selected>100%</option><option value="1.25">125%</option>
      <option value="1.5">150%</option>
    </select>
    <div class="tb-right">
      <span class="conn" id="connBadge"><i></i><span>…</span></span>
      <a class="tb-btn" id="btnApp" href="../mockups/" style="text-decoration:none">Open app</a>
      <button class="tb-btn" id="btnTheme">Dark</button>
      <button class="tb-btn" id="btnMode">Preview</button>
    </div>
  </div>

  <div class="body">
    <div class="palette" id="palette"></div>
    <div class="stage" id="stage">
      <div class="canvas-wrap" id="canvasWrap"><div id="canvas" class="grid"></div></div>
    </div>
    <div class="inspector">
      <div class="insp-head" id="inspHead">Properties</div>
      <div class="insp-body" id="inspBody"></div>
      <div class="layers">
        <div class="insp-head">Layers
          <span style="float:right;text-transform:none;letter-spacing:0;" id="layerCount"></span>
        </div>
        <div class="layer-list" id="layerList"></div>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span id="statLeft">Loading…</span>
    <span class="sp" id="statPos">—</span>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/json" style="display:none">

<script src="../shared/renderer.js"></script>
<script src="../shared/store.js"></script>
<script>
/* =====================================================================
   SCADA SCREEN EDITOR
   ---------------------------------------------------------------------
   Edits the same JSON screen documents the app shell renders, through
   the same shared renderer — so the canvas here is what ships there.

   With the server running, Save writes the file into data/screens-v2/.
   Without it (e.g. GitHub Pages), Save falls back to this browser's
   localStorage and Export hands you the JSON to commit.
   ===================================================================== */

const GRID = 10;
const $ = id => document.getElementById(id);
const canvas = $('canvas');

let screen = null;
let selection = [];
let undoStack = [], redoStack = [];
let snap = true, zoom = 1, mode = 'edit';

/* ---------- undo / redo (snapshot based) --------------------------- */
function snapshot(){
  undoStack.push(JSON.stringify(screen));
  if(undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
  refreshUndo();
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify(screen));
  screen = JSON.parse(undoStack.pop());
  selection = selection.filter(findEl);
  renderAll(); refreshUndo();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify(screen));
  screen = JSON.parse(redoStack.pop());
  selection = selection.filter(findEl);
  renderAll(); refreshUndo();
}
function refreshUndo(){
  $('btnUndo').disabled = !undoStack.length;
  $('btnRedo').disabled = !redoStack.length;
}

/* ---------- element helpers ----------------------------------------- */
let idSeq = 1;
function nextId(){
  let id;
  do { id = 'e' + (idSeq++); } while(screen && screen.elements.some(e => e.id === id));
  return id;
}
function findEl(id){ return screen.elements.find(e => e.id === id); }
function selectedEls(){ return selection.map(findEl).filter(Boolean); }
function snapV(v){ return snap ? Math.round(v/GRID)*GRID : Math.round(v); }

function makeEl(type, x, y){
  const t = Scada.TYPES[type];
  const el = {
    id: nextId(), type,
    x: Math.round(x), y: Math.round(y), w: t.w, h: t.h,
    props: JSON.parse(JSON.stringify(t.props || {})),
    style: JSON.parse(JSON.stringify(t.style || {}))
  };
  if(t.bind) el.bind = { value: '' };
  return el;
}
function addElement(type){
  snapshot();
  const stage = $('stage');
  const el = makeEl(type, snapV((stage.scrollLeft + 40)/zoom), snapV((stage.scrollTop + 40)/zoom));
  screen.elements.push(el);
  selection = [el.id];
  renderAll();
}

/* ---------- render --------------------------------------------------- */
function renderAll(){
  if(!screen) return;
  canvas.style.width  = screen.canvas.width + 'px';
  canvas.style.height = screen.canvas.height + 'px';
  canvas.style.background = screen.canvas.background || 'var(--bg-app)';
  canvas.classList.toggle('grid', snap && mode === 'edit');
  canvas.innerHTML = '';

  const opts = { tags: ScadaStore.tags, showAlarms: false };
  const frag = document.createDocumentFragment();
  screen.elements.forEach(el=>{
    const node = Scada.renderElement(el, opts);
    if(mode === 'edit' && selection.includes(el.id)) node.classList.add('selected');
    frag.appendChild(node);
  });
  canvas.appendChild(frag);

  if(mode === 'edit') drawHandles();
  renderInspector();
  renderLayers();
  $('statLeft').textContent = screen.screen_id + ' — ' + screen.elements.length + ' elements'
    + (selection.length ? ', ' + selection.length + ' selected' : '');
}

function drawHandles(){
  const els = selectedEls().filter(e => !e.locked);
  if(els.length !== 1) return;
  const el = els[0];
  [['nw',0,0],['ne',1,0],['sw',0,1],['se',1,1]].forEach(([k,fx,fy])=>{
    const h = document.createElement('div');
    h.className = 'handle ' + k;
    h.style.left = (el.x + fx*el.w - 4) + 'px';
    h.style.top  = (el.y + fy*el.h - 4) + 'px';
    h.dataset.handle = k;
    canvas.appendChild(h);
  });
}

/* ---------- selection / drag / resize -------------------------------- */
let drag = null;

canvas.addEventListener('mousedown', e=>{
  if(mode !== 'edit') return;
  const pt = canvasPoint(e);

  if(e.target.dataset.handle){
    const el = selectedEls()[0];
    drag = { kind:'resize', handle:e.target.dataset.handle, start:pt,
             orig:{x:el.x,y:el.y,w:el.w,h:el.h}, id:el.id, moved:false };
    e.preventDefault(); return;
  }

  const node = e.target.closest('.el');
  if(node){
    const el = findEl(node.dataset.id);
    if(!el || el.locked){ e.preventDefault(); return; }
    if(e.shiftKey){
      selection.includes(el.id) ? selection = selection.filter(i=>i!==el.id)
                                : selection.push(el.id);
    } else if(!selection.includes(el.id)){
      selection = [el.id];
    }
    renderAll();
    drag = { kind:'move', start:pt, moved:false,
             orig: selectedEls().map(x=>({id:x.id, x:x.x, y:x.y})) };
    e.preventDefault(); return;
  }

  if(!e.shiftKey){ selection = []; renderAll(); }
  drag = { kind:'marquee', start:pt, moved:false };
  e.preventDefault();
});

window.addEventListener('mousemove', e=>{
  if(mode === 'edit' && screen){
    const p = canvasPoint(e);
    $('statPos').textContent = Math.round(p.x) + ', ' + Math.round(p.y);
  }
  if(!drag) return;
  const pt = canvasPoint(e);
  const dx = pt.x - drag.start.x, dy = pt.y - drag.start.y;
  if(Math.abs(dx) > 1 || Math.abs(dy) > 1) drag.moved = true;

  if(drag.kind === 'move'){
    if(!drag.snapped){ snapshot(); drag.snapped = true; }
    drag.orig.forEach(o=>{
      const el = findEl(o.id);
      el.x = snapV(o.x + dx); el.y = snapV(o.y + dy);
    });
    renderAll();
  }
  else if(drag.kind === 'resize'){
    if(!drag.snapped){ snapshot(); drag.snapped = true; }
    const el = findEl(drag.id), o = drag.orig, h = drag.handle;
    let x=o.x, y=o.y, w=o.w, hh=o.h;
    if(h.includes('e')) w = Math.max(2, snapV(o.w + dx));
    if(h.includes('s')) hh = Math.max(2, snapV(o.h + dy));
    if(h.includes('w')){ const nx = snapV(o.x + dx); w = Math.max(2, o.x + o.w - nx); x = nx; }
    if(h.includes('n')){ const ny = snapV(o.y + dy); hh = Math.max(2, o.y + o.h - ny); y = ny; }
    Object.assign(el, {x, y, w, h:hh});
    renderAll();
  }
  else if(drag.kind === 'marquee'){
    let m = $('marqueeBox');
    if(!m){ m = document.createElement('div'); m.className='marquee'; m.id='marqueeBox';
            canvas.appendChild(m); }
    m.style.left = Math.min(drag.start.x, pt.x) + 'px';
    m.style.top  = Math.min(drag.start.y, pt.y) + 'px';
    m.style.width = Math.abs(dx) + 'px';
    m.style.height = Math.abs(dy) + 'px';
  }
});

window.addEventListener('mouseup', e=>{
  if(!drag) return;
  if(drag.kind === 'marquee'){
    const pt = canvasPoint(e);
    const x1 = Math.min(drag.start.x, pt.x), y1 = Math.min(drag.start.y, pt.y);
    const x2 = Math.max(drag.start.x, pt.x), y2 = Math.max(drag.start.y, pt.y);
    const m = $('marqueeBox'); if(m) m.remove();
    if(drag.moved){
      const hit = screen.elements.filter(el => !el.locked && !el.hidden &&
        el.x < x2 && el.x + el.w > x1 && el.y < y2 && el.y + el.h > y1).map(el => el.id);
      selection = e.shiftKey ? [...new Set([...selection, ...hit])] : hit;
    }
    renderAll();
  }
  // a click that never moved shouldn't leave an undo entry behind
  if(drag.snapped && !drag.moved){ undoStack.pop(); refreshUndo(); }
  drag = null;
});

function canvasPoint(e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left)/zoom, y:(e.clientY - r.top)/zoom };
}

/* ---------- keyboard -------------------------------------------------- */
window.addEventListener('keydown', e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const ctrl = e.ctrlKey || e.metaKey;

  if(ctrl && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if(ctrl && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
  if(ctrl && e.key.toLowerCase() === 's'){ e.preventDefault(); save(); return; }
  if(ctrl && e.key.toLowerCase() === 'd'){ e.preventDefault(); duplicateSelection(); return; }
  if(ctrl && e.key.toLowerCase() === 'a'){
    e.preventDefault();
    selection = screen.elements.filter(el => !el.locked).map(el => el.id);
    renderAll(); return;
  }
  if(mode !== 'edit') return;

  if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); deleteSelection(); return; }
  if(e.key === 'Escape'){ selection = []; renderAll(); return; }

  const nudge = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]}[e.key];
  if(nudge && selection.length){
    e.preventDefault();
    const step = e.shiftKey ? GRID : 1;
    snapshot();
    selectedEls().forEach(el=>{ el.x += nudge[0]*step; el.y += nudge[1]*step; });
    renderAll();
  }
});

function deleteSelection(){
  if(!selection.length) return;
  snapshot();
  screen.elements = screen.elements.filter(el => !selection.includes(el.id));
  selection = [];
  renderAll();
}
function duplicateSelection(){
  if(!selection.length) return;
  snapshot();
  const copies = selectedEls().map(el=>{
    const c = JSON.parse(JSON.stringify(el));
    c.id = nextId(); c.x += GRID; c.y += GRID;
    return c;
  });
  screen.elements.push(...copies);
  selection = copies.map(c => c.id);
  renderAll();
}

/* ---------- align / distribute / z-order ------------------------------ */
function align(how){
  const els = selectedEls(); if(els.length < 2) return;
  snapshot();
  const L = Math.min(...els.map(e=>e.x)), R = Math.max(...els.map(e=>e.x+e.w));
  const T = Math.min(...els.map(e=>e.y)), B = Math.max(...els.map(e=>e.y+e.h));
  els.forEach(e=>{
    if(how === 'left')    e.x = L;
    if(how === 'right')   e.x = R - e.w;
    if(how === 'hcenter') e.x = Math.round((L+R)/2 - e.w/2);
    if(how === 'top')     e.y = T;
    if(how === 'bottom')  e.y = B - e.h;
    if(how === 'vcenter') e.y = Math.round((T+B)/2 - e.h/2);
  });
  renderAll();
}
function distribute(axis){
  const els = selectedEls(); if(els.length < 3) return;
  snapshot();
  const k = axis === 'h' ? 'x' : 'y', d = axis === 'h' ? 'w' : 'h';
  els.sort((a,b)=>a[k]-b[k]);
  const first = els[0], last = els[els.length-1];
  const span = (last[k] + last[d]) - first[k];
  const total = els.reduce((s,e)=>s+e[d], 0);
  const gap = (span - total)/(els.length - 1);
  let cur = first[k];
  els.forEach(e=>{ e[k] = Math.round(cur); cur += e[d] + gap; });
  renderAll();
}
function zorder(how){
  const els = selectedEls(); if(!els.length) return;
  snapshot();
  const rest = screen.elements.filter(e => !selection.includes(e.id));
  if(how === 'front') screen.elements = [...rest, ...els];
  if(how === 'back')  screen.elements = [...els, ...rest];
  if(how === 'fwd' || how === 'bwd'){
    const arr = screen.elements, step = how === 'fwd' ? 1 : -1;
    const idxs = els.map(e=>arr.indexOf(e)).sort((a,b)=> step>0 ? b-a : a-b);
    idxs.forEach(i=>{
      const j = i + step;
      if(j >= 0 && j < arr.length){ [arr[i], arr[j]] = [arr[j], arr[i]]; }
    });
  }
  renderAll();
}

/* ---------- inspector -------------------------------------------------- */
function renderInspector(){
  const body = $('inspBody'), head = $('inspHead');
  body.innerHTML = '';
  const els = selectedEls();

  if(!els.length){
    head.textContent = 'Screen';
    body.appendChild(field('Screen id', textInput(screen.screen_id, v=>{
      if(v) { screen.screen_id = v; renderAll(); }
    })));
    body.appendChild(field('Title', textInput(screen.title||'', v=>{ screen.title = v; })));
    body.appendChild(field('Unit', textInput(screen.unit||'', v=>{ screen.unit = v; })));
    const row = div('fld-row');
    row.appendChild(field('Width', numInput(screen.canvas.width, v=>{
      snapshot(); screen.canvas.width = v; renderAll(); })));
    row.appendChild(field('Height', numInput(screen.canvas.height, v=>{
      snapshot(); screen.canvas.height = v; renderAll(); })));
    body.appendChild(row);
    body.appendChild(field('Background', colorInput(screen.canvas.background||'#eef1f4', v=>{
      snapshot(); screen.canvas.background = v; renderAll(); })));
    const note = div('empty-note');
    note.innerHTML = 'Click an element to edit it.<br><br>' +
      '<kbd>Shift</kbd>+click or drag a box to multi-select · ' +
      '<kbd>Del</kbd> remove · <kbd>Ctrl</kbd>+<kbd>D</kbd> duplicate · ' +
      '<kbd>Ctrl</kbd>+<kbd>Z</kbd> undo · arrows nudge (<kbd>Shift</kbd> = 10px) · ' +
      '<kbd>Ctrl</kbd>+<kbd>S</kbd> save';
    body.appendChild(note);
    return;
  }

  if(els.length > 1){
    head.textContent = els.length + ' elements selected';
    body.appendChild(sectionLabel('Align'));
    body.appendChild(btnRow([['Left',()=>align('left')],['Center',()=>align('hcenter')],
                             ['Right',()=>align('right')]]));
    body.appendChild(btnRow([['Top',()=>align('top')],['Middle',()=>align('vcenter')],
                             ['Bottom',()=>align('bottom')]]));
    body.appendChild(sectionLabel('Distribute'));
    body.appendChild(btnRow([['Horizontally',()=>distribute('h')],
                             ['Vertically',()=>distribute('v')]]));
    body.appendChild(sectionLabel('Order'));
    body.appendChild(btnRow([['To front',()=>zorder('front')],['To back',()=>zorder('back')]]));
    body.appendChild(sectionLabel('Edit'));
    body.appendChild(btnRow([['Duplicate',duplicateSelection],
                             ['Delete',deleteSelection,'danger']]));
    body.appendChild(sectionLabel('Apply to all selected'));
    body.appendChild(field('Font size', numInput('', v=>{
      snapshot(); els.forEach(e=>{ if(e.style) e.style.fontSize = v; }); renderAll(); })));
    body.appendChild(field('Text colour', colorInput('#3a4753', v=>{
      snapshot(); els.forEach(e=>{ if(e.style) e.style.color = v; }); renderAll(); })));
    body.appendChild(field('Fill', colorInput('#f6f8f9', v=>{
      snapshot(); els.forEach(e=>{ if(e.style) e.style.fill = v; }); renderAll(); })));
    return;
  }

  const el = els[0], def = Scada.TYPES[el.type];
  head.textContent = def.label;
  body.appendChild(field('Name', textInput(el.name||'', v=>{ el.name = v; renderLayers(); })));

  const pos = div('fld-row');
  pos.appendChild(field('X', numInput(el.x, v=>{ snapshot(); el.x = v; renderAll(); })));
  pos.appendChild(field('Y', numInput(el.y, v=>{ snapshot(); el.y = v; renderAll(); })));
  body.appendChild(pos);
  const size = div('fld-row');
  size.appendChild(field('W', numInput(el.w, v=>{ snapshot(); el.w = v; renderAll(); })));
  size.appendChild(field('H', numInput(el.h, v=>{ snapshot(); el.h = v; renderAll(); })));
  body.appendChild(size);

  if(def.bind){
    body.appendChild(sectionLabel('Tag binding'));
    body.appendChild(field('Tag', tagPicker(el)));
    const t = ScadaStore.getTag(el.bind && el.bind.value);
    if(t){
      const n = div('empty-note');
      n.innerHTML = '<b>' + esc(t.description) + '</b><br>Live value: ' +
        esc(String(t.value)) + ' ' + esc(t.engineering_unit || '');
      body.appendChild(n);
    }
  }

  if((def.fields||[]).length) body.appendChild(sectionLabel('Appearance'));
  (def.fields||[]).forEach(f=>{
    const node = buildField(el, f);
    if(node) body.appendChild(node);
  });

  body.appendChild(sectionLabel('Order'));
  body.appendChild(btnRow([['To front',()=>zorder('front')],['Forward',()=>zorder('fwd')]]));
  body.appendChild(btnRow([['To back',()=>zorder('back')],['Backward',()=>zorder('bwd')]]));

  body.appendChild(sectionLabel('Element'));
  body.appendChild(checkbox('Locked (not selectable on canvas)', !!el.locked,
    v=>{ el.locked = v; renderAll(); }));
  body.appendChild(checkbox('Hidden', !!el.hidden, v=>{ el.hidden = v; renderAll(); }));
  body.appendChild(btnRow([['Duplicate',duplicateSelection],
                           ['Delete',deleteSelection,'danger']]));
}

function buildField(el, f){
  const s = el.style || (el.style = {}), p = el.props || (el.props = {});
  const set = (obj,k) => v => { snapshot(); obj[k] = v; renderAll(); };
  switch(f){
    case 'text':        return field('Text', textInput(p.text||'', set(p,'text')));
    case 'unit':        return field('Unit suffix', textInput(p.unit||'', set(p,'unit')));
    case 'caption':     return field('Caption', textInput(p.caption||'', set(p,'caption')));
    case 'decimals':    return field('Decimals (blank = auto)',
                          textInput(p.decimals==null?'':p.decimals, v=>{
                            snapshot(); p.decimals = v===''?null:parseInt(v,10); renderAll(); }));
    case 'fill':        return field('Fill', colorInput(s.fill||'#ffffff', set(s,'fill')));
    case 'stroke':      return field('Border colour', colorInput(s.stroke||'#c3cad2', set(s,'stroke')));
    case 'color':       return field('Text colour', colorInput(s.color||'#3a4753', set(s,'color')));
    case 'strokeWidth': return field('Border width', numInput(s.strokeWidth??1, set(s,'strokeWidth')));
    case 'radius':      return field('Corner radius', numInput(s.radius||0, set(s,'radius')));
    case 'fontSize':    return field('Font size', numInput(s.fontSize||11, set(s,'fontSize')));
    case 'opacity':     return field('Opacity', numInput(s.opacity??1, set(s,'opacity'), 0, 1, 0.05));
    case 'level':       return field('Level %', numInput(p.level||0, set(p,'level'), 0, 100));
    case 'dash':        return field('Dash (0 = solid)', numInput(p.dash||0, set(p,'dash')));
    case 'bold':        return checkbox('Bold', !!s.bold, set(s,'bold'));
    case 'bevel':       return checkbox('Bevelled (3D)', !!p.bevel, set(p,'bevel'));
    case 'dashed':      return checkbox('Dashed border', !!p.dashed, set(p,'dashed'));
    case 'min':         return field('Min', numInput(p.min ?? 0, set(p,'min')));
    case 'max':         return field('Max', numInput(p.max ?? 100, set(p,'max')));
    case 'value':       return field('Value (unbound)', numInput(p.value ?? 0, set(p,'value')));
    case 'marker':      return field('Max marker (blank = none)',
                          textInput(p.marker == null ? '' : p.marker, v=>{
                            snapshot(); p.marker = v===''?null:parseFloat(v); renderAll(); }));
    case 'orientation': return field('Orientation', selectInput(
                          [['vertical','Vertical'],['horizontal','Horizontal']],
                          p.orientation||'vertical', set(p,'orientation')));
    case 'state':       return field('State', selectInput(
                          [['running','Running (green)'],['stopped','Stopped (blue)'],
                           ['maintenance','Maintenance (yellow)'],['trip','Shutdown / trip (red)']],
                          p.state||'running', set(p,'state')));
    case 'breakerState':return field('State', selectInput(
                          [['closed','Closed (green)'],['open','Open (white)'],
                           ['trip','Tripped (red)']],
                          p.state||'closed', set(p,'state')));
    case 'cylinders':   return field('Cylinders drawn', numInput(p.cylinders||9,
                          set(p,'cylinders'), 4, 12));
    case 'capacity':    return field('Capacity label', textInput(p.capacity||'', set(p,'capacity')));
    case 'label':       return field('Name', textInput(p.label||'', set(p,'label')));
    case 'plate':       return field('Plate / tag no.', textInput(p.plate||'', set(p,'plate')));
    case 'switches':    return checkbox('Level switches', p.switches !== false, set(p,'switches'));
    case 'rows':        return rowsEditor(el, p);
    case 'kind':        return field('Shape', selectInput(
                          [['exchanger','Heat exchanger'],['filter','Filter'],
                           ['diamond','Diamond'],['circle','Circle'],
                           ['triangle-up','Triangle ▲'],['triangle-down','Triangle ▼'],
                           ['triangle-right','Triangle ▶'],['triangle-left','Triangle ◀']],
                          p.kind||'exchanger', set(p,'kind')));
    case 'relayKind':   return field('Device', selectInput(
                          [['relay','Protection relay'],['meter','Power meter']],
                          p.kind||'relay', set(p,'kind')));
    case 'earth':       return checkbox('Earthing switch', p.earth !== false,
                          set(p,'earth'));
    case 'arrowDir':    return field('Direction', selectInput(
                          [['right','▶ right'],['left','◀ left'],
                           ['up','▲ up'],['down','▼ down']],
                          p.dir||'right', set(p,'dir')));
    case 'running':     return checkbox('Running', !!p.running, set(p,'running'));
    case 'open':        return checkbox('Open', !!p.open, set(p,'open'));
    case 'closed':      return checkbox('Closed', !!p.closed, set(p,'closed'));
    case 'align':       return field('Align', selectInput(
                          [['left','Left'],['center','Center'],['right','Right']],
                          s.align||'left', set(s,'align')));
    case 'shape':       return field('Shape', selectInput(
                          [['circle','Circle'],['square','Square']], p.shape||'circle', set(p,'shape')));
    case 'dir':         return field('Direction', selectInput(
                          [['tl-br','↘ diagonal'],['bl-tr','↗ diagonal'],
                           ['h','— horizontal'],['v','| vertical']], p.dir||'tl-br', set(p,'dir')));
  }
  return null;
}

/* ---------- control factories ------------------------------------------ */
function div(cls){ const d = document.createElement('div'); d.className = cls; return d; }
function field(labelText, control){
  const w = div('fld');
  const l = document.createElement('label'); l.textContent = labelText;
  w.appendChild(l); w.appendChild(control);
  return w;
}
function sectionLabel(t){
  const d = div('pal-group'); d.textContent = t; d.style.marginTop = '12px'; return d;
}
function textInput(val, onChange){
  const i = document.createElement('input');
  i.type = 'text'; i.value = val;
  i.addEventListener('change', ()=>onChange(i.value));
  return i;
}
function numInput(val, onChange, min, max, step){
  const i = document.createElement('input');
  i.type = 'number'; i.value = val;
  if(min != null) i.min = min; if(max != null) i.max = max; i.step = step || 1;
  i.addEventListener('change', ()=>{
    const v = parseFloat(i.value);
    if(!isNaN(v)) onChange(v);
  });
  return i;
}
function colorInput(val, onChange){
  const i = document.createElement('input');
  i.type = 'color'; i.value = toHex(val);
  i.addEventListener('input', ()=>onChange(i.value));
  return i;
}
function selectInput(opts, val, onChange){
  const s = document.createElement('select');
  opts.forEach(([v,l])=>{
    const o = document.createElement('option'); o.value = v; o.textContent = l;
    if(v === val) o.selected = true;
    s.appendChild(o);
  });
  s.addEventListener('change', ()=>onChange(s.value));
  return s;
}
function checkbox(labelText, val, onChange){
  const w = div('fld-check');
  const i = document.createElement('input'); i.type = 'checkbox'; i.checked = val;
  i.addEventListener('change', ()=>onChange(i.checked));
  const l = document.createElement('label'); l.textContent = labelText; l.style.cursor = 'pointer';
  l.addEventListener('click', ()=>{ i.checked = !i.checked; onChange(i.checked); });
  w.appendChild(i); w.appendChild(l);
  return w;
}
function btnRow(defs){
  const r = div('btn-row');
  defs.forEach(([label, fn, cls])=>{
    const b = document.createElement('button');
    b.className = 'mini-btn' + (cls ? ' ' + cls : '');
    b.textContent = label;
    b.addEventListener('click', fn);
    r.appendChild(b);
  });
  return r;
}
/* Tank rows are data, so they get a real editor: add, remove, bind each
   row to its own tag, and set the text it falls back to when unbound. */
function rowsEditor(el, p){
  const wrap = div('fld');
  const l = document.createElement('label');
  l.textContent = 'Rows (top to bottom)';
  wrap.appendChild(l);

  const rows = Array.isArray(p.rows) ? p.rows : (p.rows = []);
  rows.forEach((row, i)=>{
    const box = div('row-item');
    const head = div('row-head');
    head.textContent = 'Row ' + (i + 1);
    const del = document.createElement('button');
    del.className = 'mini-btn danger'; del.textContent = '✕';
    del.style.flex = '0 0 24px';
    del.addEventListener('click', ()=>{
      snapshot(); rows.splice(i,1); renderAll();
    });
    head.appendChild(del);
    box.appendChild(head);

    const t = textInput(row.text || '', v=>{ snapshot(); row.text = v; renderAll(); });
    t.placeholder = 'static text';
    box.appendChild(t);

    const sel = document.createElement('select');
    const none = document.createElement('option');
    none.value=''; none.textContent='— no tag —';
    sel.appendChild(none);
    [...ScadaStore.tags.values()]
      .sort((a,b)=>a.tag_id.localeCompare(b.tag_id))
      .forEach(tg=>{
        const o = document.createElement('option');
        o.value = tg.tag_id; o.textContent = tg.tag_id;
        if(row.tag === tg.tag_id) o.selected = true;
        sel.appendChild(o);
      });
    if(row.tag && !ScadaStore.tags.has(row.tag)){
      const o = document.createElement('option');
      o.value=row.tag; o.textContent=row.tag+' (not in tag DB)'; o.selected=true;
      sel.appendChild(o);
    }
    sel.style.marginTop='3px';
    sel.addEventListener('change', ()=>{ snapshot(); row.tag = sel.value; renderAll(); });
    box.appendChild(sel);
    wrap.appendChild(box);
  });

  const add = document.createElement('button');
  add.className = 'mini-btn'; add.textContent = '+ Add row';
  add.style.width = '100%';
  add.addEventListener('click', ()=>{
    snapshot(); rows.push({ tag:'', text:'0' }); renderAll();
  });
  wrap.appendChild(add);
  return wrap;
}

function tagPicker(el){
  const wrap = document.createElement('div');
  const s = document.createElement('select');
  const none = document.createElement('option');
  none.value = ''; none.textContent = '— none (static text) —';
  s.appendChild(none);
  [...ScadaStore.tags.values()]
    .sort((a,b)=>a.tag_id.localeCompare(b.tag_id))
    .forEach(t=>{
      const o = document.createElement('option');
      o.value = t.tag_id;
      o.textContent = t.tag_id + ' · ' + t.description;
      if(el.bind && el.bind.value === t.tag_id) o.selected = true;
      s.appendChild(o);
    });
  const cur = el.bind && el.bind.value;
  if(cur && !ScadaStore.tags.has(cur)){
    const o = document.createElement('option');
    o.value = cur; o.textContent = cur + ' · (not in tag DB)'; o.selected = true;
    s.appendChild(o);
  }
  s.addEventListener('change', ()=>{
    snapshot(); el.bind = el.bind || {}; el.bind.value = s.value; renderAll();
  });
  wrap.appendChild(s);
  const manual = textInput(cur || '', v=>{
    snapshot(); el.bind = el.bind || {}; el.bind.value = v; renderAll();
  });
  manual.placeholder = 'or type a tag id';
  manual.style.marginTop = '4px';
  wrap.appendChild(manual);
  return wrap;
}
function toHex(c){
  if(!c) return '#000000';
  if(c.startsWith('#')) return c.length === 4
    ? '#' + [...c.slice(1)].map(x=>x+x).join('') : c;
  return '#000000';
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}

/* ---------- layers ------------------------------------------------------ */
function renderLayers(){
  const list = $('layerList');
  list.innerHTML = '';
  $('layerCount').textContent = screen.elements.length;
  [...screen.elements].reverse().forEach(el=>{
    const row = div('layer' + (selection.includes(el.id) ? ' sel' : ''));
    const eye = div('eye');
    eye.textContent = el.hidden ? '○' : (el.locked ? '⊘' : '●');
    eye.title = el.hidden ? 'Hidden' : (el.locked ? 'Locked' : 'Visible');
    eye.addEventListener('click', ev=>{ ev.stopPropagation(); el.hidden = !el.hidden; renderAll(); });
    const t = div('lt'); t.textContent = el.name || labelFor(el);
    const ty = div('ltype'); ty.textContent = el.type;
    row.appendChild(eye); row.appendChild(t); row.appendChild(ty);
    row.addEventListener('click', e=>{
      if(e.shiftKey){
        selection.includes(el.id) ? selection = selection.filter(i=>i!==el.id)
                                  : selection.push(el.id);
      } else selection = [el.id];
      renderAll();
    });
    list.appendChild(row);
  });
}
function labelFor(el){
  const p = el.props || {};
  if(el.bind && el.bind.value) return el.bind.value;
  if(p.text) return p.text;
  if(p.caption) return p.caption;
  return el.type + ' ' + el.id;
}

/* ---------- palette ------------------------------------------------------ */
function renderPalette(){
  const pal = $('palette');
  pal.innerHTML = '';
  const groups = {};
  Object.entries(Scada.TYPES).forEach(([k,t])=>{
    (groups[t.group] = groups[t.group] || []).push([k,t]);
  });
  Object.entries(groups).forEach(([g, items])=>{
    const gl = div('pal-group'); gl.textContent = g; pal.appendChild(gl);
    items.forEach(([k,t])=>{
      const b = document.createElement('button');
      b.className = 'pal-item';
      const ic = div('pal-ic');
      ic.appendChild(paletteIcon(k));
      b.appendChild(ic);
      b.appendChild(document.createTextNode(t.label));
      b.addEventListener('click', ()=>addElement(k));
      pal.appendChild(b);
    });
  });
}
function paletteIcon(type){
  const mini = makeEl(type, 0, 0);
  const size = { rect:[16,11], line:[16,11], pipe:[16,3], text:[16,11], readout:[18,11],
                 led:[9,9], pump:[13,13], valve:[13,9], tank:[11,13], engine:[18,10],
                 turbo:[9,15], breaker:[10,10], button:[18,11] }[type] || [16,11];
  mini.w = size[0]; mini.h = size[1];
  if(mini.props){ mini.props.text = ''; mini.props.caption = ''; }
  return Scada.renderElement(mini, {});
}

/* ---------- screens ------------------------------------------------------ */
async function refreshScreenList(){
  await ScadaStore.loadScreenIndex();
  const sel = $('screenSel');
  sel.innerHTML = '';
  ScadaStore.screenIndex.forEach(s=>{
    const o = document.createElement('option');
    o.value = s.screen_id;
    o.textContent = s.screen_id + (s.local ? ' (local)' : '');
    if(screen && s.screen_id === screen.screen_id) o.selected = true;
    sel.appendChild(o);
  });
}
async function openScreen(id){
  try{
    screen = await ScadaStore.loadScreen(id);
  }catch(e){
    toast('Could not open ' + id + ': ' + e.message);
    return;
  }
  screen.canvas = screen.canvas || { width:1400, height:760 };
  selection = []; undoStack.length = 0; redoStack.length = 0;
  refreshUndo();
  await refreshScreenList();
  applyZoom();
  renderAll();
}
async function newScreen(){
  const id = prompt('New screen id (e.g. G2.Temp):', 'New.Screen');
  if(!id) return;
  screen = { screen_id:id, title:id, layout:'canvas',
             canvas:{ width:1400, height:760, background:'#eef1f4' }, elements:[] };
  selection = []; undoStack.length = 0; redoStack.length = 0;
  await ScadaStore.saveScreen(screen);
  await refreshScreenList();
  renderAll();
}
const SAVE_MESSAGE = {
  server: 'Saved to data/screens-v2/ — the app shell will pick it up',
  'cloudflare-kv': 'Saved — live now for everyone on this site. Export to commit it to git.',
  browser: 'Saved to this browser only (no screen API) — use Export to commit it'
};
async function save(){
  try{
    const r = await ScadaStore.saveScreen(screen);
    toast(SAVE_MESSAGE[r.where] || ('Saved (' + r.where + ')'));
    await refreshScreenList();
  }catch(e){ toast('Save failed: ' + e.message); }
}
function exportScreen(){
  const blob = new Blob([JSON.stringify(screen, null, 2) + '\n'], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = screen.screen_id.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Exported ' + a.download);
}
function importScreen(file){
  const r = new FileReader();
  r.onload = async ()=>{
    try{
      const doc = JSON.parse(r.result);
      if(!doc.screen_id || !Array.isArray(doc.elements)) throw new Error('Not a screen document');
      doc.canvas = doc.canvas || { width:1400, height:760 };
      screen = doc;
      await ScadaStore.saveScreen(doc);
      await refreshScreenList();
      renderAll();
      toast('Imported ' + doc.screen_id);
    }catch(e){ toast('Import failed: ' + e.message); }
  };
  r.readAsText(file);
}

/* ---------- wiring -------------------------------------------------------- */
$('btnNew').addEventListener('click', newScreen);
$('btnSave').addEventListener('click', save);
$('btnExport').addEventListener('click', exportScreen);
$('btnImport').addEventListener('click', ()=>$('fileInput').click());
$('fileInput').addEventListener('change', e=>{
  if(e.target.files[0]) importScreen(e.target.files[0]);
  e.target.value = '';
});
$('btnUndo').addEventListener('click', undo);
$('btnRedo').addEventListener('click', redo);
$('screenSel').addEventListener('change', e=>openScreen(e.target.value));
$('btnGrid').addEventListener('click', ()=>{
  snap = !snap;
  $('btnGrid').classList.toggle('on', snap);
  $('btnGrid').textContent = snap ? 'Grid 10' : 'Grid off';
  renderAll();
});
$('zoomSel').addEventListener('change', e=>{ zoom = parseFloat(e.target.value); applyZoom(); });
function applyZoom(){
  const wrap = $('canvasWrap');
  wrap.style.transform = 'scale(' + zoom + ')';
  wrap.style.width  = (screen.canvas.width * zoom) + 'px';
  wrap.style.height = (screen.canvas.height * zoom) + 'px';
}
$('btnMode').addEventListener('click', ()=>{
  mode = mode === 'edit' ? 'preview' : 'edit';
  $('app').className = 'app mode-' + mode;
  $('btnMode').textContent = mode === 'edit' ? 'Preview' : 'Edit';
  $('btnMode').classList.toggle('on', mode === 'preview');
  if(mode === 'preview') selection = [];
  renderAll();
});
$('btnTheme').addEventListener('click', ()=>{
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  $('btnTheme').textContent = dark ? 'Dark' : 'Light';
});

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* The editor cares about where a *save* lands, not whether the plant is
   ticking — so this badge reflects screen storage, not simulation. */
ScadaStore.on('status', s=>{
  const b = $('connBadge');
  b.className = 'conn ' + (s.apiScreens ? 'live' : 'static');
  b.querySelector('span').textContent = s.apiScreens ? 'saves to server' : 'local only';
  b.title = s.apiScreens
    ? 'Saving stores the screen server-side — the app shell picks it up immediately'
    : 'No screen API — saves go to this browser only. Use Export to commit a screen to git.';
});

/* ---------- boot ------------------------------------------------------------ */
(async function init(){
  await ScadaStore.init({ root: '..', simulate: false });
  renderPalette();
  const params = new URLSearchParams(location.search);
  const want = params.get('screen');
  const list = ScadaStore.screenIndex;
  const first = list.find(s => s.screen_id === want) || list[0];
  if(first) await openScreen(first.screen_id);
  else await newScreen();
  if(params.get('mode') === 'preview') $('btnMode').click();
  refreshUndo();
})();
</script>
</body>
</html>

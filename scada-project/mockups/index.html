<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WOIS - Stelco 5th</title>
<style>
  :root{ font-size:14px; }
  * { box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:#eef1f4;
    color:#3a4753;
    font-family:"Segoe UI","Arial",sans-serif;
    overflow:hidden;
  }
  .num{ font-family:"Consolas","SF Mono",monospace; }

  /* ============ ROW 1: top-level nav ============ */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background: linear-gradient(#161d25,#12181f);
    border-bottom: 1px solid #232c36;
    padding: 4px 10px; height: 32px;
  }
  .topbar-left{ display:flex; align-items:center; gap:14px; }
  .brand{ display:flex; align-items:center; gap:8px; color:#8a94a0; font-weight:600; letter-spacing:0.5px; font-size:12px;}
  .brand .mark{ width:18px;height:18px;border-radius:50%;border:2px solid #8a94a0; }
  .toptabs{ display:flex; gap:18px; }
  .toptabs span{ font-size:12.5px; color:#8a94a0; cursor:pointer; padding-bottom:4px; }
  .toptabs span.active{ color:#f47b20; border-bottom:2px solid #f47b20; font-weight:600; }
  .topbar-right{ display:flex; align-items:center; gap:16px; font-size:12px; color:#8a94a0; }
  .wois-title{ color:#e7ecf1; font-weight:600; font-size:13px;}
  .user{ color:#8a94a0; font-size:11.5px; }

  /* ============ ROW 2 / ROW 3 ============ */
  .unitbar, .pagebar{
    display:flex; align-items:center; gap:8px;
    background:#0f151b; border-bottom:1px solid #232c36;
    padding: 3px 10px; height:26px;
  }
  .unitbar span, .pagebar span{
    font-size:12px; color:#8a94a0; padding:2px 9px; border-radius:2px; cursor:pointer; white-space:nowrap;
  }
  .unitbar span.active{ background:#f47b20; color:#1a1005; font-weight:700;}
  .pagebar span.active{ color:#f47b20; border-bottom:2px solid #f47b20; font-weight:600;}
  .unitbar span:hover, .pagebar span:hover{ color:#e7ecf1; }
  .pagebar{ overflow-x:auto; }
  .bartag{ color:#5c6a78; font-size:10.5px; margin-left:auto; white-space:nowrap; }

  /* ============ CONTENT AREA ============ */
  #contentArea{ height: calc(100% - 32px); }
  #contentArea.with-subnav{ height: calc(100% - 32px - 26px - 26px); }
  #screenFrame{ width:100%; height:100%; border:none; display:block; }
  .placeholder-main{
    display:flex; align-items:center; justify-content:center;
    height:100%; color:#7c8896; font-size:14px; background:#eef1f4;
  }
</style>
</head>
<body>

<!-- ROW 1: top-level nav -->
<div class="topbar">
  <div class="topbar-left">
    <div class="brand"><span class="mark"></span>WÄRTSILÄ</div>
    <div class="toptabs" id="topTabs">
      <span class="active" data-tab="Processes">Processes</span>
      <span data-tab="Alarms">Alarms</span>
      <span data-tab="Trends">Trends</span>
      <span data-tab="Reports">Reports</span>
    </div>
  </div>
  <div class="topbar-right">
    <span class="wois-title">WOIS - Stelco 5th</span>
    <span class="user">User: Operator2</span>
  </div>
</div>

<!-- ROW 2: unit/process selector (Processes tab only) -->
<div class="unitbar" id="unitBar" style="display:none;"></div>

<!-- ROW 3: page tabs within selected unit (Processes tab only) -->
<div class="pagebar" id="pageBar" style="display:none;"></div>

<div id="contentArea"></div>

<script>
/* ================= SCREEN REGISTRY =================
   Only entries with a `file` are built. Everything else renders
   as a "not modeled yet" placeholder until it's designed and ported.
*/
const COMMON_PAGES = [
  { id:"overview",     label:"Overview",      file:"screens/common-overview.html" },
  { id:"electrical1",  label:"Electrical 1" },
  { id:"electrical2",  label:"Electrical 2" },
  { id:"fuel",         label:"Fuel",          file:"screens/common-fuel.html" },
  { id:"startair",     label:"Start air" },
  { id:"oilywater",    label:"Oily water" },
  { id:"cooling",      label:"Cooling" },
  { id:"water",        label:"Water" },
  { id:"automation1",  label:"Automation 1" },
  { id:"automation2",  label:"Automation 2" },
];

function enginePages(overrides){
  const base = [
    { id:"temp",     label:"Temp" },
    { id:"control",  label:"Control" },
    { id:"fuel",     label:"Fuel" },
    { id:"lube",     label:"Lube" },
    { id:"cooling",  label:"Cooling" },
    { id:"exhaust",  label:"Exh. gas" },
  ];
  return base.map(p => overrides[p.id] ? { ...p, file: overrides[p.id] } : p);
}

const UNITS = {
  Common: COMMON_PAGES,
  G1: enginePages({ temp:"screens/g1-temp.html", fuel:"screens/g1-fuel.html" }),
  G2: enginePages({}),
  G3: enginePages({}),
  G4: enginePages({ control:"screens/g4-control.html" }),
  G5: enginePages({}),
  G6: enginePages({}),
};
const UNIT_ORDER = ["Common","G1","G2","G3","G4","G5","G6"];

/* ================= STATE ================= */
let currentTopTab = "Processes";
let currentUnit = "Common";
let currentPage = "overview";

const topTabs = document.getElementById('topTabs');
const unitBar = document.getElementById('unitBar');
const pageBar = document.getElementById('pageBar');
const contentArea = document.getElementById('contentArea');

topTabs.querySelectorAll('span[data-tab]').forEach(el=>{
  el.addEventListener('click', ()=>{
    topTabs.querySelectorAll('span').forEach(s=>s.classList.remove('active'));
    el.classList.add('active');
    currentTopTab = el.dataset.tab;
    renderAll();
  });
});

function renderUnitBar(){
  unitBar.innerHTML = "";
  UNIT_ORDER.forEach(u=>{
    const span = document.createElement('span');
    span.textContent = u;
    span.dataset.unit = u;
    if(u === currentUnit) span.classList.add('active');
    span.addEventListener('click', ()=>{
      currentUnit = u;
      currentPage = UNITS[u][0].id;
      renderAll();
    });
    unitBar.appendChild(span);
  });
}

function renderPageBar(){
  pageBar.innerHTML = "";
  const pages = UNITS[currentUnit];
  pages.forEach(p=>{
    const span = document.createElement('span');
    span.textContent = p.label;
    if(p.id === currentPage) span.classList.add('active');
    span.addEventListener('click', ()=>{
      currentPage = p.id;
      renderAll();
    });
    pageBar.appendChild(span);
  });
  const note = document.createElement('span');
  note.className = 'bartag';
  note.textContent = currentUnit === "Common" ? "Common view — shared across all gensets" : "Engine page — specific to " + currentUnit + "'s tags";
  pageBar.appendChild(note);
}

function renderContent(){
  if(currentTopTab !== "Processes"){
    contentArea.innerHTML = `<div class="placeholder-main">${currentTopTab} — not modeled in this reference build yet.</div>`;
    return;
  }
  const page = UNITS[currentUnit].find(p => p.id === currentPage);
  if(page && page.file){
    contentArea.innerHTML = `<iframe id="screenFrame" src="${page.file}?embed=1" title="${currentUnit} ${page.label}"></iframe>`;
  } else {
    const label = page ? page.label : currentPage;
    contentArea.innerHTML = `<div class="placeholder-main">${currentUnit} — ${label} — not modeled in this reference build yet.</div>`;
  }
}

function renderAll(){
  const showSubnav = currentTopTab === "Processes";
  unitBar.style.display = showSubnav ? "flex" : "none";
  pageBar.style.display = showSubnav ? "flex" : "none";
  contentArea.classList.toggle('with-subnav', showSubnav);
  if(showSubnav){
    renderUnitBar();
    renderPageBar();
  }
  renderContent();
}

renderAll();
</script>
</body>
</html>
